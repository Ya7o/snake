function winLevel(){const g=game;g.win=true;SV.cleared[selected]=true;SV.best[selected]=Math.max(SV.best[selected]||0,g.score);save();jingle('clear');setTimeout(()=>state('clear'),400);}
function drawGame(){
  const g=game,th=g.th,p=th.pal;
  ctx.fillStyle='#05050a';ctx.fillRect(0,0,W,H);
  drawThemeFrame(th);

  // HUD mobile corrigé : trois zones distinctes, aucun chevauchement possible.
  const hudH=Math.max(98,Math.min(124,g.gy-8));
  ctx.fillStyle='rgba(0,0,0,.88)';ctx.fillRect(0,0,W,hudH);
  ctx.fillStyle=p.a;ctx.fillRect(0,hudH-4,W,4);
  ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(0,hudH-16,W,2);

  const badgeW=Math.min(154,Math.max(112,W*.25));
  const goalW=Math.min(162,Math.max(118,W*.24));
  const midX=badgeW+14;
  const midW=Math.max(120,W-badgeW-goalW-28);

  txtFit(th.short,18,28,badgeW-24,p.a,22,13,'left');
  txtFit(g.st.isBoss?'BOSS':'STAGE',18,66,badgeW-24,'#fff',15,11,'left');

  // Le nom du niveau est centré dans sa propre colonne, séparée du thème et du goal.
  txtFit(g.st.name,midX+midW/2,32,midW,'#fff',18,11,'center');
  const rule=g.st.isBoss?th.bossRule:th.normalRule;
  txtFit(rule,midX+midW/2,69,midW,'#aaa9bd',11,8,'center');

  const goalTxt=g.st.isBoss?(g.st.type==='boss_rounds'?`R${(g.phase||0)+1} HP ${g.hp}`:g.st.type==='boss_finish'?(g.finishOpen?'FINISH!':`HP ${g.hp}`):`HP ${g.hp}`):g.time>0?`${Math.ceil(g.time/1000)}s`:`GOAL ${g.st.goal}`;
  txtFit(goalTxt,W-18,42,goalW,p.a,22,13,'right');

  // Plateau : fond volontairement sobre, le thème reste autour du cadre.
  ctx.fillStyle=p.bg;ctx.fillRect(g.gx,g.gy,g.gw,g.gh);
  ctx.strokeStyle=p.grid;ctx.lineWidth=1;
  for(let x=0;x<=g.cols;x++){ctx.beginPath();ctx.moveTo(g.gx+x*g.cell,g.gy);ctx.lineTo(g.gx+x*g.cell,g.gy+g.gh);ctx.stroke();}
  for(let y=0;y<=g.rows;y++){ctx.beginPath();ctx.moveTo(g.gx,g.gy+y*g.cell);ctx.lineTo(g.gx+g.gw,g.gy+y*g.cell);ctx.stroke();}
  ctx.strokeStyle=p.a;ctx.lineWidth=4;ctx.strokeRect(g.gx,g.gy,g.gw,g.gh);
  drawLaneGuides();drawWalls();drawItems();drawBoss();drawSnake();updateParticles(16);drawParticles();
  if(g.msgT>0){g.msgT-=16;txtFit(g.msg,W/2,g.gy+g.gh*.18,W*.8,p.pick,22,13,'center');}

  const footH=Math.max(44,Math.min(58,H*.06));
  ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,H-footH,W,footH);
  ctx.fillStyle=p.a;ctx.fillRect(0,H-footH,W,2);
  const extra=g.st.type==='focus_maze'?`FOCUS ${Math.floor(g.focus||0)}`:g.st.type==='charge'?`STRAIGHT ${Math.min(g.straight,4)}/4`:g.st.type==='boss_finish'?(g.finishOpen?'FINISH WINDOW':'WAIT FOR WINDOW'):rule;
  txtFit(extra,W/2,H-footH/2,W-36,'#d6d3e8',13,9,'center');
}
function drawThemeFrame(th){const p=th.pal;const g=game;
  ctx.fillStyle=p.b;ctx.fillRect(0,84,W,14);ctx.fillRect(0,H-58,W,14);
  ctx.fillStyle='rgba(255,255,255,.06)';for(let i=0;i<W;i+=32){ctx.fillRect(i,88,16,4);ctx.fillRect(i,H-54,16,4);}
  ctx.strokeStyle=p.a;ctx.lineWidth=2;ctx.strokeRect(8,90,W-16,H-148);
  // Mobile-first: use top/bottom corners for universe identity; side margins are usually too small.
  const s=Math.max(24,Math.min(54,W*.09));
  drawMotif(th,32,H-84,s);drawMotif(th,W-32,H-84,s);drawMotif(th,32,120,s*.85);drawMotif(th,W-32,120,s*.85);
  const label={castle:'MAGIC',sonic:'RINGS',streets:'NEON',fighter:'K.O.',outrun:'TURBO',shinobi:'FOCUS',kombat:'FINISH',paperboy:'DELIVER'}[th.id]||'ARCADE';
  txtFit(label,W/2,H-82,W-96,p.a,12,9,'center');
}
function drawMotif(th,x,y,s){ctx.save();ctx.translate(x,y);ctx.globalAlpha=.55;ctx.strokeStyle=th.pal.a;ctx.fillStyle=th.pal.a;ctx.lineWidth=2;const m=th.motifs[Math.floor(T/1200)%th.motifs.length];if(m==='ring'){ctx.beginPath();ctx.arc(0,0,s*.35,0,Math.PI*2);ctx.stroke();}else if(m==='shuriken'){for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,-s*.45);ctx.lineTo(s*.12,0);ctx.lineTo(0,s*.12);ctx.lineTo(-s*.12,0);ctx.closePath();ctx.fill();}}else if(m==='dragon'||m==='flame'){ctx.beginPath();ctx.moveTo(0,-s*.45);ctx.quadraticCurveTo(s*.35,0,0,s*.45);ctx.quadraticCurveTo(-s*.22,0,0,-s*.45);ctx.fill();}else if(m==='bike'){ctx.beginPath();ctx.arc(-s*.22,s*.15,s*.17,0,Math.PI*2);ctx.arc(s*.22,s*.15,s*.17,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-s*.22,s*.15);ctx.lineTo(0,-s*.10);ctx.lineTo(s*.22,s*.15);ctx.stroke();}else if(m==='car'){ctx.roundRect(-s*.42,-s*.15,s*.84,s*.3,5);ctx.stroke();}else if(m==='ko'){txt('K.O.',0,0,th.pal.a,18,'center');}else{ctx.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;ctx.lineTo(Math.cos(a)*s*.4,Math.sin(a)*s*.4);const b=a+Math.PI/5;ctx.lineTo(Math.cos(b)*s*.18,Math.sin(b)*s*.18);}ctx.closePath();ctx.fill();}ctx.restore();}
function drawLaneGuides(){const g=game,p=g.th.pal;if(!['lanes','boss_rival'].includes(g.st.type))return;ctx.save();ctx.globalAlpha=.20;ctx.strokeStyle=p.a;ctx.lineWidth=3;[5,10,15].forEach(x=>{ctx.beginPath();ctx.moveTo(g.gx+x*g.cell,g.gy);ctx.lineTo(g.gx+x*g.cell,g.gy+g.gh);ctx.stroke();});ctx.globalAlpha=.10;ctx.fillStyle=p.a;[3,7,12,16].forEach(x=>ctx.fillRect(g.gx+x*g.cell,g.gy, g.cell, g.gh));ctx.restore();}
function drawWalls(){const g=game,p=g.th.pal;const drawCell=(x,y,c,stroke=false)=>{ctx.fillStyle=c;ctx.fillRect(g.gx+x*g.cell+2,g.gy+y*g.cell+2,g.cell-4,g.cell-4);if(stroke){ctx.strokeStyle=p.danger;ctx.strokeRect(g.gx+x*g.cell+3,g.gy+y*g.cell+3,g.cell-6,g.cell-6);}};g.walls.forEach(k=>{const [x,y]=k.split(',').map(Number);drawCell(x,y,p.b);});g.temp.forEach(k=>{const [x,y]=k.split(',').map(Number);drawCell(x,y,p.danger,true);});}
function pickupLabel(g){return {castle:'STAR',sonic:'RING',streets:'BONUS',fighter:'CHI',outrun:'CHECK',shinobi:'SHURIKEN',kombat:'DRAGON',paperboy:'PAPER'}[g.th.id]||'ITEM';}
function pickupShape(g,it=null){const id=g.th.id;if(id==='sonic')return 'ring';if(id==='paperboy')return (it&&it.kind==='goldpaper')?'goldpaper':'paper';if(id==='castle')return 'star';if(id==='outrun')return 'checkpoint';if(id==='shinobi')return 'shuriken';if(id==='kombat')return 'dragon';if(id==='fighter')return 'chi';if(id==='streets')return 'can';return 'orb';}
function drawItems(){const g=game,p=g.th.pal;
 function item(x,y,c,shape,muted=false){
  const cx=g.gx+x*g.cell+g.cell/2,cy=g.gy+y*g.cell+g.cell/2,r=g.cell;
  ctx.save();ctx.globalAlpha=muted?.55:1;ctx.fillStyle=c;ctx.strokeStyle=muted?p.grid:p.ui;ctx.lineWidth=2;
  if(shape==='ring'){
    ctx.strokeStyle=c;ctx.lineWidth=Math.max(2,r*.10);ctx.beginPath();ctx.arc(cx,cy,r*.26,0,Math.PI*2);ctx.stroke();ctx.lineWidth=Math.max(1,r*.045);ctx.beginPath();ctx.arc(cx,cy,r*.13,0,Math.PI*2);ctx.stroke();
  }else if(shape==='paper'||shape==='goldpaper'){
    ctx.fillStyle=shape==='goldpaper'?p.a:p.pick;ctx.strokeStyle=p.b;ctx.fillRect(cx-r*.24,cy-r*.18,r*.48,r*.36);ctx.strokeRect(cx-r*.24,cy-r*.18,r*.48,r*.36);ctx.strokeStyle=p.b;ctx.beginPath();ctx.moveTo(cx-r*.18,cy-r*.05);ctx.lineTo(cx+r*.18,cy-r*.05);ctx.moveTo(cx-r*.18,cy+r*.06);ctx.lineTo(cx+r*.12,cy+r*.06);ctx.stroke();
  }else if(shape==='checkpoint'){
    ctx.fillStyle=p.a;ctx.fillRect(cx-r*.22,cy-r*.32,r*.10,r*.64);ctx.fillStyle=p.pick;ctx.fillRect(cx-r*.12,cy-r*.32,r*.38,r*.22);ctx.strokeRect(cx-r*.12,cy-r*.32,r*.38,r*.22);
  }else if(shape==='shuriken'){
    ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<8;i++){const a=-Math.PI/2+i*Math.PI/4,rr=i%2===0?r*.30:r*.10;ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.stroke();
  }else if(shape==='star'){
    ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2===0?r*.30:r*.13;ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.stroke();
  }else if(shape==='dragon'){
    ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(cx,cy-r*.32);ctx.lineTo(cx+r*.28,cy);ctx.lineTo(cx+r*.10,cy+r*.30);ctx.lineTo(cx,cy+r*.16);ctx.lineTo(cx-r*.10,cy+r*.30);ctx.lineTo(cx-r*.28,cy);ctx.closePath();ctx.fill();ctx.stroke();
  }else if(shape==='chi'){
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx,cy,r*.25,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=p.bg;ctx.beginPath();ctx.arc(cx,cy,r*.10,0,Math.PI*2);ctx.fill();
  }else if(shape==='can'){
    ctx.fillStyle=c;ctx.roundRect(cx-r*.19,cy-r*.27,r*.38,r*.54,4);ctx.fill();ctx.stroke();ctx.strokeStyle=p.b;ctx.beginPath();ctx.moveTo(cx-r*.12,cy-r*.10);ctx.lineTo(cx+r*.12,cy-r*.10);ctx.moveTo(cx-r*.12,cy+r*.10);ctx.lineTo(cx+r*.12,cy+r*.10);ctx.stroke();
  }else{
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx,cy,r*.25,0,Math.PI*2);ctx.fill();ctx.stroke();
  }
  ctx.restore();
 }
 if(g.food)item(g.food.x,g.food.y,p.pick,pickupShape(g,g.food));
 g.items.forEach(it=>item(it.x,it.y,it.kind==='fake'?p.b:p.pick,pickupShape(g,it),it.kind==='fake'));
}
function drawBoss(){const g=game,p=g.th.pal;if(!g.boss||!g.boss.parts)return;g.boss.parts.forEach((b,i)=>{if(b.x<0||b.y<0||b.x>=g.cols||b.y>=g.rows)return;ctx.globalAlpha=1-i/g.boss.parts.length*.45;ctx.fillStyle=(g.st.type==='boss_finish'&&g.finishOpen&&i===0)?p.pick:(i===0?p.danger:p.b);ctx.roundRect(g.gx+b.x*g.cell+2,g.gy+b.y*g.cell+2,g.cell-4,g.cell-4,4);ctx.fill();});ctx.globalAlpha=1;}
function drawSnake(){const g=game,p=g.th.pal;g.snake.forEach((s,i)=>{const cx=g.gx+s.x*g.cell+g.cell/2,cy=g.gy+s.y*g.cell+g.cell/2;ctx.fillStyle=i===0?p.snake:p.snake2;ctx.roundRect(cx-g.cell*.42,cy-g.cell*.42,g.cell*.84,g.cell*.84,6);ctx.fill();if(i===0){ctx.fillStyle='#fff';ctx.fillRect(cx+g.dir.x*g.cell*.14-3,cy+g.dir.y*g.cell*.14-4,3,3);ctx.fillRect(cx+g.dir.x*g.cell*.14+3,cy+g.dir.y*g.cell*.14-4,3,3);}});}
function drawIntro(){const st=STAGES[selected],th=THEMES[st.theme],p=th.pal;ctx.fillStyle='#05050a';ctx.fillRect(0,0,W,H);drawConsoleFrame(22,46,W-44,H-92,p.a,p.ui);drawMotif(th,W*.5,H*.26,90);txt(th.name,W/2,H*.42,p.a,Math.min(25,W*.06),'center');txt(st.isBoss?'BOSS MISSION':'NORMAL MISSION',W/2,H*.50,'#ffe66a',Math.min(16,W*.043),'center');txt(st.name,W/2,H*.58,'#fff',Math.min(22,W*.052),'center');const rule=st.isBoss?th.bossRule:th.normalRule;wrap(rule,W/2,H*.70,W*.78,15,'#d8d5e8');if(T>1700)state('play');}
function wrap(str,x,y,max,sz,c){ctx.save();ctx.font=`700 ${sz}px monospace`;ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';const words=str.split(' ');let line='',dy=0;for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>max){ctx.fillText(line,x,y+dy);line=w;dy+=sz*1.5;}else line=test;}if(line)ctx.fillText(line,x,y+dy);ctx.restore();}
function drawClear(){const st=STAGES[selected],th=THEMES[st.theme],p=th.pal;ctx.fillStyle='#05050a';ctx.fillRect(0,0,W,H);drawConsoleFrame(20,50,W-40,H-100,p.a,'#ffe66a');drawMotif(th,W/2,H*.28,100);txt(st.isBoss?'BOSS TOKEN':'MEGA TOKEN',W/2,H*.45,p.pick,Math.min(26,W*.065),'center');txt('STAGE CLEAR',W/2,H*.55,'#fff',Math.min(23,W*.055),'center');txt(th.name,W/2,H*.64,p.a,Math.min(16,W*.04),'center');if(Math.sin(T*.006)>-.1)txt('TAP TO WORLD MAP',W/2,H*.78,'#aaa',Math.min(14,W*.037),'center');}
function drawGameOver(){ctx.fillStyle='#05050a';ctx.fillRect(0,0,W,H);drawConsoleFrame(30,80,W-60,H-160,'#ff4455','#9a61ff');txt('GAME OVER',W/2,H*.38,'#ff4455',Math.min(34,W*.09),'center');txt('TAP TO RETURN TO MAP',W/2,H*.56,'#fff',Math.min(16,W*.045),'center');}
function loop(now){T+=16;try{if(STATE==='boot')drawBoot();else if(STATE==='title')drawTitle();else if(STATE==='map')drawMap();else if(STATE==='intro')drawIntro();else if(STATE==='play'){updateLevel(16);drawGame();}else if(STATE==='clear')drawClear();else if(STATE==='gameover')drawGameOver();}catch(e){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);txt('ERROR',20,40,'#f55',20);wrap(String(e&&e.message||e),W/2,H/2,W*.8,14,'#fff');console.error(e);}requestAnimationFrame(loop);}requestAnimationFrame(loop);jingle('boot');
function playSelected(){state('intro');}
let lastTapStage=-1,lastRealTouch=0;
function handleTap(x,y){resumeAudio();if(STATE==='boot'||STATE==='title'){state('map');return;}if(STATE==='clear'||STATE==='gameover'){state('map');return;}if(STATE==='map'){const m=toMap(x,y);let best=-1,bd=1e9;NODES.forEach((n,i)=>{const d=Math.hypot(m.x-n.x,m.y-n.y);if(d<bd){bd=d;best=i;}});const now=Date.now();if(best>=0&&bd<42/map.scale){const canLaunch=best===selected&&best===lastTapStage&&now-lastTap>110&&now-lastTap<460;if(canLaunch){playSelected();lastTap=0;lastTapStage=-1;}else{selected=best;lastTap=now;lastTapStage=best;beep(520,.06,'square',.04);}}return;}}
let touch={start:null,mode:null,lastDist:0,lastScale:1};
cv.addEventListener('touchstart',e=>{lastRealTouch=Date.now();resumeAudio();if(STATE==='map'&&e.touches.length===2){touch.mode='pinch';const a=e.touches[0],b=e.touches[1];touch.lastDist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);touch.lastScale=map.scale;map.px=(a.clientX+b.clientX)/2;map.py=(a.clientY+b.clientY)/2;}else if(e.touches.length===1){const t=e.touches[0];touch.start={x:t.clientX,y:t.clientY,ts:Date.now(),mx:map.x,my:map.y};touch.mode='drag';}}, {passive:false});
cv.addEventListener('touchmove',e=>{if(STATE==='map'){e.preventDefault();if(touch.mode==='pinch'&&e.touches.length===2){const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const old=map.scale;map.scale=clamp(touch.lastScale*(d/touch.lastDist),map.min,map.max);const mx=(cx-map.x)/old,my=(cy-map.y)/old;map.x=cx-mx*map.scale;map.y=cy-my*map.scale;clampMap();}else if(touch.mode==='drag'&&e.touches.length===1&&touch.start){const t=e.touches[0];map.x=touch.start.mx+(t.clientX-touch.start.x);map.y=touch.start.my+(t.clientY-touch.start.y);clampMap();}}else if(STATE==='play'&&touch.start&&e.touches.length===1){const t=e.touches[0],dx=t.clientX-touch.start.x,dy=t.clientY-touch.start.y;if(Math.abs(dx)>26||Math.abs(dy)>26){if(Math.abs(dx)>Math.abs(dy))pushDir(dx>0?1:-1,0);else pushDir(0,dy>0?1:-1);touch.start={x:t.clientX,y:t.clientY,ts:Date.now(),mx:0,my:0};}}},{passive:false});
cv.addEventListener('touchend',e=>{lastRealTouch=Date.now();if(touch.start&&touch.mode==='drag'){const t=e.changedTouches&&e.changedTouches[0];const ex=t?t.clientX:touch.start.x,ey=t?t.clientY:touch.start.y;const dx=ex-touch.start.x,dy=ey-touch.start.y;if(Math.abs(dx)<12&&Math.abs(dy)<12)handleTap(touch.start.x,touch.start.y);}touch.start=null;touch.mode=null;},{passive:false});
cv.addEventListener('mousedown',e=>{if(Date.now()-lastRealTouch<700)return;touch.start={x:e.clientX,y:e.clientY,ts:Date.now(),mx:map.x,my:map.y};touch.mode='drag';});
addEventListener('mousemove',e=>{if(Date.now()-lastRealTouch<700)return;if(touch.mode==='drag'&&touch.start&&STATE==='map'){map.x=touch.start.mx+(e.clientX-touch.start.x);map.y=touch.start.my+(e.clientY-touch.start.y);clampMap();}});
addEventListener('mouseup',e=>{if(Date.now()-lastRealTouch<700)return;if(touch.start){const dx=e.clientX-touch.start.x,dy=e.clientY-touch.start.y;if(Math.abs(dx)<8&&Math.abs(dy)<8)handleTap(e.clientX,e.clientY);}touch.start=null;touch.mode=null;});
addEventListener('keydown',e=>{if(STATE==='play'){if(e.key==='ArrowUp')pushDir(0,-1);if(e.key==='ArrowDown')pushDir(0,1);if(e.key==='ArrowLeft')pushDir(-1,0);if(e.key==='ArrowRight')pushDir(1,0);}else if(e.key==='Enter'||e.key===' '){if(STATE==='map')playSelected();else if(STATE==='title'||STATE==='boot')state('map');else if(STATE==='clear'||STATE==='gameover')state('map');}});
// coherent-level self-test: every stage can initialize, has a safe spawn, and has free cells.
function selfTest(){const old=selected,oldg=game;let bad=[];for(let i=0;i<16;i++){selected=i;startStage(i);const g=game;const head=g.snake[0];if(occupied(head.x,head.y,true))bad.push(i+1+':spawn');if(g.boss&&g.boss.parts.some(p=>p.x<0||p.y<0||p.x>=g.cols||p.y>=g.rows))bad.push(i+1+':boss-out');let free=0;for(let y=0;y<g.rows;y++)for(let x=0;x<g.cols;x++)if(!occupied(x,y,true))free++;if(free<80)bad.push(i+1+':free');const hasObj=!!g.food||g.items.length>0;if(!hasObj)bad.push(i+1+':no-objective');}selected=old;game=oldg;console.log('Snake V3 coherence self-test',bad.length?bad:'OK');}
setTimeout(selfTest,500);
